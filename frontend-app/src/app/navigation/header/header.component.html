<mat-toolbar class="topbar">
    <a class="brand" routerLink="/" aria-label="zwei home"><span class="brand-mark">Z</span><span>zwei</span></a>
    <span class="topbar-spacer"></span>
    <button class="account-button" *ngIf="isAuthenticated" mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu"><span class="account-avatar">{{ profile?.display_name?.slice(0, 2)?.toUpperCase() || 'ME' }}</span></button>
    <mat-menu #accountMenu="matMenu"><div class="account-menu-name" mat-menu-item disabled>{{ profile?.display_name || 'Account' }}</div><div class="account-menu-email" mat-menu-item disabled>{{ profile?.email }}</div><a mat-menu-item routerLink="/profile"><mat-icon>person</mat-icon><span>Profile</span></a><button mat-menu-item (click)="toggleTheme()"><mat-icon>{{ isDarkTheme ? 'light_mode' : 'dark_mode' }}</mat-icon><span>Switch to {{ isDarkTheme ? 'light' : 'dark' }} theme</span></button><button mat-menu-item (click)="onLogout()"><mat-icon>logout</mat-icon><span>Sign out</span></button></mat-menu>
</mat-toolbar>

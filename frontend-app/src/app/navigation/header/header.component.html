<mat-toolbar class="topbar">
    <a class="brand" routerLink="/" aria-label="zwei home"><span class="brand-mark">Z</span><span class="brand-name">zwei</span></a>
    <span class="topbar-spacer"></span>
    <button class="account-button" *ngIf="isAuthenticated" mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu" (menuOpened)="applyAccountMenuTheme()"><span class="account-avatar">{{ profile?.display_name?.slice(0, 2)?.toUpperCase() || 'ME' }}</span></button>
    <mat-menu #accountMenu="matMenu"><div class="account-menu-name" mat-menu-item disabled>{{ profile?.display_name || 'Account' }}</div><div class="account-menu-email" mat-menu-item disabled>{{ profile?.email }}</div><a mat-menu-item routerLink="/profile"><zwei-icon name="person"></zwei-icon><span>Profile</span></a><button *ngIf="pwa.canInstall" mat-menu-item (click)="install()"><zwei-icon name="sync"></zwei-icon><span>Install Zwei</span></button><button *ngIf="pwa.updateAvailable" mat-menu-item (click)="applyUpdate()"><zwei-icon name="sync"></zwei-icon><span>Update available — Reload</span></button><button mat-menu-item (click)="toggleTheme()"><zwei-icon [name]="isDarkTheme ? 'light_mode' : 'dark_mode'"></zwei-icon><span>Switch to {{ isDarkTheme ? 'light' : 'dark' }} theme</span></button><button mat-menu-item (click)="onLogout()"><zwei-icon name="logout"></zwei-icon><span>Sign out</span></button></mat-menu>
</mat-toolbar>

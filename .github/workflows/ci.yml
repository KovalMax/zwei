name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-quality:
    name: Go format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format Go code
        run: go fmt ./services/...

      - name: Check formatting changes
        run: git diff --exit-code -- services

      - name: Run Go linter
        run: go vet ./services/...

  go-test:
    name: Go unit tests
    needs: go-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare local Compose files
        run: make -C infrastructure check_dist_files

      - name: Start PostgreSQL and Redis test dependencies
        run: >-
          docker compose -p messenger-go-tests
          --env-file infrastructure/.env
          -f infrastructure/docker-compose.yml
          -f infrastructure/docker-compose.override.yml
          up -d --wait database redis

      - name: Apply database migrations
        run: make -C infrastructure APP_NAME=messenger-go-tests migrate

      - name: Run Go tests with race detection
        env:
          ZWEI_TEST_DATABASE_URL: postgres://messenger_user:user-password@127.0.0.1:3379/messenger?sslmode=disable
          ZWEI_TEST_REDIS_URL: redis://127.0.0.1:6380/0
        run: go test -race ./services/...

      - name: Stop PostgreSQL and Redis test dependencies
        if: always()
        run: >-
          docker compose -p messenger-go-tests
          --env-file infrastructure/.env
          -f infrastructure/docker-compose.yml
          -f infrastructure/docker-compose.override.yml
          down -v

  frontend-quality:
    name: Angular tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular unit tests with coverage
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Upload Angular coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: angular-coverage
          path: frontend-app/coverage/
          if-no-files-found: error

  e2e:
    name: Playwright E2E
    needs: [go-test, frontend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare local Compose files
        run: make -C infrastructure check_dist_files

      - name: Start application stack
        run: >-
          docker compose -p messenger
          --env-file infrastructure/.env
          -f infrastructure/docker-compose.yml
          -f infrastructure/docker-compose.override.yml
          up -d --build database auth chat realtime frontend traefik

      - name: Apply database migrations
        run: make migrate

      - name: Wait for frontend
        run: >-
          curl --fail --silent --show-error --insecure
          --retry 30 --retry-all-errors --retry-delay 2
          --resolve chat.localhost:443:127.0.0.1
          https://chat.localhost/

      - name: Prepare Playwright artifacts
        run: mkdir -p e2e/test-results

      - name: Run Playwright tests
        run: make e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: e2e/test-results/
          if-no-files-found: error

      - name: Stop application stack
        if: always()
        run: docker compose -p messenger -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.override.yml down -v

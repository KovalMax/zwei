name: Security

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to verify when called by a release workflow
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: GOTOOLCHAIN=go1.27.4 go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./services/...

  npm-vulnerabilities:
    name: npm vulnerabilities (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend-app, e2e, .opencode]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm audit --audit-level=high

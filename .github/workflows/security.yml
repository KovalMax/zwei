name: Security

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to verify when called by a release workflow
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: GOTOOLCHAIN=go1.27.3 go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./services/...

  npm-vulnerabilities:
    name: npm vulnerabilities (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend-app, e2e]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm audit --audit-level=high

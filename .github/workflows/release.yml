name: Release deployment

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve release source commit
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Check out published release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Resolve immutable commit
        id: resolve
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-ci:
    name: Run full CI for release source
    uses: ./.github/workflows/ci.yml
    needs: resolve-source
    with:
      source_ref: ${{ needs.resolve-source.outputs.commit }}

  verify-security:
    name: Run security checks for release source
    uses: ./.github/workflows/security.yml
    needs: resolve-source
    with:
      source_ref: ${{ needs.resolve-source.outputs.commit }}

  publish:
    name: Publish ${{ matrix.image }} image
    needs: [resolve-source, verify-ci, verify-security]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth
            dockerfile: infrastructure/golang/Dockerfile
            target: prod
            build-args: SERVICE=auth
          - image: chat
            dockerfile: infrastructure/golang/Dockerfile
            target: prod
            build-args: SERVICE=chat
          - image: realtime
            dockerfile: infrastructure/golang/Dockerfile
            target: prod
            build-args: SERVICE=realtime
          - image: frontend
            dockerfile: infrastructure/production/Dockerfile.frontend
            target: ''
            build-args: ''
          - image: migrator
            dockerfile: infrastructure/production/Dockerfile.migrator
            target: ''
            build-args: ''
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zwei-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=sha-${{ needs.resolve-source.outputs.commit }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy release commit
    needs: [resolve-source, publish]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      IMAGE_TAG: sha-${{ needs.resolve-source.outputs.commit }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Validate deployment path
        run: sh infrastructure/scripts/validate-deploy-path.sh "$DEPLOY_PATH"

      - name: Prepare deployment directory
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 750 '$DEPLOY_PATH' && test \"\$(realpath -m -- '$DEPLOY_PATH')\" = '$DEPLOY_PATH'"

      - name: Synchronize production configuration
        run: |
          rsync --archive --compress --delete \
            --exclude '.env' \
            --exclude '.deploy.env' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            infrastructure/production/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Select immutable commit image tag
        run: |
          case "$IMAGE_TAG" in
            ''|*[!A-Za-z0-9._-]*)
              echo 'Release tag contains unsupported characters.' >&2
              exit 1
              ;;
          esac
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "umask 077 && cat > '$DEPLOY_PATH/.deploy.env'"

      - name: Pull, migrate, and start services
        id: deploy
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             cd '$DEPLOY_PATH'
             set -a
             . ./.env
             . ./.deploy.env
             set +a
             sh ./release-deploy.sh"

      - name: Close edge after deployment failure
        if: ${{ (failure() || cancelled()) && steps.deploy.outcome != 'skipped' && steps.deploy.outcome != '' }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; cd '$DEPLOY_PATH'; set -a; . ./.env; . ./.deploy.env; set +a; docker compose stop traefik coturn"

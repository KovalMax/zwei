services:
  e2e:
    environment:
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: Password123!
      E2E_FIXTURE_DATABASE: messenger_test
      E2E_FIXTURE_DB_USER: ${APP_DB_USER:-messenger_user}
      E2E_FIXTURE_DB_PASSWORD: ${APP_DB_PASSWORD:-user-password}
  frontend:
    command: npm run start -- --configuration=e2e
  auth:
    environment:
      DATABASE_URL: "postgres://${APP_DB_USER:-messenger_user}:${APP_DB_PASSWORD:-user-password}@database:5432/messenger_test?sslmode=disable"
      REDIS_URL: "redis://redis:6379/1"
      # Docker Desktop routes browser tests through its 192.168.65.0/24 host gateway.
      # This is isolated to the disposable E2E database/stack; production remains narrow.
      ADMIN_ALLOWED_IPS: "172.16.0.0/12,192.168.65.0/24,127.0.0.1/32,::1/128"
      TRUSTED_PROXY_CIDRS: "${E2E_TRAEFIK_IP:-172.30.0.250}/32"
      # Stable public test identity lets E2E verify persisted push subscriptions
      # even when the local .env.dist intentionally leaves Web Push unconfigured.
      VAPID_PUBLIC_KEY: "BGsX0fLhLEJH-Lzm5WOkQPJ3A32BLeszoPShOUXYmMKWT-NC4v4af5uO5-tKfA-eFivOM1drMV7Oy7ZAaDe_UfU"

  chat:
    environment:
      DATABASE_URL: "postgres://${APP_DB_USER:-messenger_user}:${APP_DB_PASSWORD:-user-password}@database:5432/messenger_test?sslmode=disable"

  realtime:
    environment:
      DATABASE_URL: "postgres://${APP_DB_USER:-messenger_user}:${APP_DB_PASSWORD:-user-password}@database:5432/messenger_test?sslmode=disable"
      REDIS_URL: "redis://redis:6379/1"

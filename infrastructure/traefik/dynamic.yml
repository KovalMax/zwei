tls:
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key

http:
  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: geolocation=(), microphone=(self), camera=()
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; connect-src 'self' https://auth.localhost https://api.chat.localhost wss://ws.chat.localhost; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
          Cross-Origin-Opener-Policy: same-origin
          X-Permitted-Cross-Domain-Policies: none
    auth-rate-limit:
      rateLimit:
        average: 30
        period: 1m
        burst: 100
    search-rate-limit:
      rateLimit:
        average: 30
        period: 1m
        burst: 40
    chat-rate-limit:
      rateLimit:
        average: 120
        period: 1m
        burst: 40
    realtime-rate-limit:
      rateLimit:
        average: 30
        period: 1m
        burst: 20
    kyc-basic-auth:
      basicAuth:
        realm: Zwei KYC (local)
        users:
          - "kyc-admin:$2y$05$LNCg9fRrfSFLJ4g4NQaLROysAqCNAlxxlE8xiEjE1N/9iCRI8bf06"
  routers:
    dashboard:
      rule: Host(`traefik.localhost`)
      entryPoints: [websecure]
      service: api@internal
      tls: {}
      middlewares: [security-headers]
    frontend:
      rule: Host(`chat.localhost`)
      entryPoints: [websecure]
      service: frontend
      tls: {}
      middlewares: [security-headers]
    admin-frontend:
      rule: Host(`kyc.localhost`)
      entryPoints: [websecure]
      service: frontend
      priority: 10
      tls: {}
      middlewares: [security-headers, kyc-basic-auth]
    auth:
      rule: Host(`auth.localhost`) || (Host(`chat.localhost`) && PathPrefix(`/api/auth`))
      entryPoints: [websecure]
      service: auth
      priority: 100
      tls: {}
      middlewares: [security-headers, auth-rate-limit]
    admin-auth:
      rule: Host(`kyc.localhost`) && PathPrefix(`/api/auth`)
      entryPoints: [websecure]
      service: auth
      priority: 110
      tls: {}
      middlewares: [security-headers, auth-rate-limit]
    admin-api:
      rule: Host(`kyc.localhost`) && PathPrefix(`/api/admin`)
      entryPoints: [websecure]
      service: auth
      priority: 110
      tls: {}
      middlewares: [security-headers]
    user-search:
      rule: Host(`api.chat.localhost`) && Path(`/api/chat/users/search`)
      entryPoints: [websecure]
      service: chat
      priority: 110
      tls: {}
      middlewares: [security-headers, search-rate-limit]
    chat-api:
      rule: Host(`api.chat.localhost`) || (Host(`chat.localhost`) && PathPrefix(`/api/chat`))
      entryPoints: [websecure]
      service: chat
      priority: 100
      tls: {}
      middlewares: [security-headers, chat-rate-limit]
    realtime:
      rule: Host(`ws.chat.localhost`) || (Host(`chat.localhost`) && PathPrefix(`/ws`))
      entryPoints: [websecure]
      service: realtime
      priority: 100
      tls: {}
      middlewares: [security-headers, realtime-rate-limit]

  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:4200
    auth:
      loadBalancer:
        servers:
          - url: http://auth:8081
    chat:
      loadBalancer:
        servers:
          - url: http://chat:8082
    realtime:
      loadBalancer:
        servers:
          - url: http://realtime:8083

services:
  auth:
    build:
      context: ..
      dockerfile: infrastructure/golang/Dockerfile
      target: dev
      args:
        SERVICE: auth
    environment:
      AUTH_PORT: 8081
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME}
      REFRESH_TOKEN_LIFETIME: ${REFRESH_TOKEN_LIFETIME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      ACTIVATION_URL: ${ACTIVATION_URL}
      INVITATION_URL: ${INVITATION_URL:-https://chat.localhost/sign-up}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    networks: [messenger-network]

  chat:
    build:
      context: ..
      dockerfile: infrastructure/golang/Dockerfile
      target: dev
      args:
        SERVICE: chat
    environment:
      CHAT_PORT: 8082
      DATABASE_URL: ${DATABASE_URL}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    networks: [messenger-network]

  realtime:
    build:
      context: ..
      dockerfile: infrastructure/golang/Dockerfile
      target: dev
      args:
        SERVICE: realtime
    environment:
      REALTIME_PORT: 8083
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      REDIS_URL: ${REDIS_URL}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_URLS: ${TURN_URLS}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    networks: [messenger-network]

  e2e:
    build:
      context: ../e2e
      dockerfile: ../infrastructure/playwright/Dockerfile
    environment:
      BASE_URL: ${BASE_URL}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD}
      KYC_BASIC_AUTH_USER: ${KYC_BASIC_AUTH_USER}
      KYC_BASIC_AUTH_PASSWORD: ${KYC_BASIC_AUTH_PASSWORD}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "chat.localhost:host-gateway"
      - "auth.localhost:host-gateway"
      - "api.chat.localhost:host-gateway"
      - "ws.chat.localhost:host-gateway"
      - "kyc.localhost:host-gateway"
      - "traefik.localhost:host-gateway"
    depends_on:
      traefik:
        condition: service_started
      mailpit:
        condition: service_healthy
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      realtime:
        condition: service_healthy
    networks: [messenger-network]

  frontend:
    build:
      context: ../frontend-app
      dockerfile: ../infrastructure/node/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        NODE_USER_NAME: ${NODE_USER_NAME}
    environment:
      NODE_ENV: ${NODE_ENV}
    networks: [messenger-network]

  traefik-certgen:
    build:
      context: traefik
      dockerfile: Dockerfile
    volumes:
      - ./traefik-certs:/certs
    networks: [messenger-network]

  traefik:
    image: traefik:v3.5
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yml
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik-certs:/certs:ro
    depends_on:
      traefik-certgen:
        condition: service_completed_successfully
    networks: [messenger-network]

  mailpit:
    image: axllent/mailpit:v1.21
    networks: [messenger-network]

  coturn:
    image: coturn/coturn:4.6.3
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=turn.chat.localhost
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tcp-relay
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks: [messenger-network]

  database:
    image: postgres:${APP_DB_VERSION:-18.4}-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [messenger-network]

  redis:
    image: redis:${REDIS_VERSION:-8.2.1}-alpine
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [messenger-network]

networks:
  messenger-network:
    driver: bridge

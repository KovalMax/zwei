name: zwei

services:
  traefik:
    image: traefik:v3.5
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ${KYC_BASIC_AUTH_FILE:?KYC_BASIC_AUTH_FILE is required}:/run/secrets/kyc.htpasswd:ro
      - traefik-acme:/acme
    networks: [edge]
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --realm=turn.chat.false.tel
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tcp-relay
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks: [turn]
    restart: unless-stopped

  frontend:
    image: ${IMAGE_REPOSITORY:-ghcr.io/kovalmax/zwei}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge]
    restart: unless-stopped

  auth:
    image: ${IMAGE_REPOSITORY:-ghcr.io/kovalmax/zwei}-auth:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      AUTH_PORT: 8081
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_LIFETIME: ${ACCESS_TOKEN_LIFETIME:-15m}
      REFRESH_TOKEN_LIFETIME: ${REFRESH_TOKEN_LIFETIME:-720h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ACTIVATION_URL: ${ACTIVATION_URL:-https://chat.false.tel/activate}
      INVITATION_URL: ${INVITATION_URL:-https://chat.false.tel/sign-up}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:?ADMIN_ALLOWED_IPS is required}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, backend]
    restart: unless-stopped

  chat:
    image: ${IMAGE_REPOSITORY:-ghcr.io/kovalmax/zwei}-chat:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      CHAT_PORT: 8082
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?MESSAGE_ENCRYPTION_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, backend]
    restart: unless-stopped

  realtime:
    image: ${IMAGE_REPOSITORY:-ghcr.io/kovalmax/zwei}-realtime:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      REALTIME_PORT: 8083
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?MESSAGE_ENCRYPTION_KEY is required}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      TURN_URLS: ${TURN_URLS:-turn:turn.chat.false.tel:3478?transport=udp,turn:turn.chat.false.tel:3478?transport=tcp}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, backend]
    restart: unless-stopped

  migrate:
    image: ${IMAGE_REPOSITORY:-ghcr.io/kovalmax/zwei}-migrator:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      database:
        condition: service_healthy
    networks: [backend]
    profiles: [migration]

  database:
    image: postgres:${APP_DB_VERSION:-18.4}-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?APP_DB_NAME is required}
      POSTGRES_USER: ${APP_DB_USER:?APP_DB_USER is required}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:${REDIS_VERSION:-8.2.1}-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped
    volumes:
      - redis-data:/data

networks:
  edge:
  backend:
    internal: true
  turn:

volumes:
  postgres-data:
  redis-data:
  traefik-acme:
